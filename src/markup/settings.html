<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/settings.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>
  <body>
    <main>
      <div id="header" class="flex-row">
        <h1>Settings</h1>
        <button style="height: 30px">
          <a class="link" href="./index.html">
            <i class="fa-solid fa-house"></i>
          </a>
        </button>
      </div>

      <div id="settings-menu">
        <ul>
          <form action="submit">
            <input type="checkbox" name="autoload" id="autoload" />
            <li style="margin: 6px 0 6px 6px">Autoload</li>
          </form>
          <form action="submit">
            <select name="family" id="family">
              <option value="Johnson Family">Johnson Family</option>
              <option value="Smith Family">Smith Family</option>
            </select>
            <li style="margin: 6px">Active</li>
          </form>
        </ul>
      </div>
      <form id="upload" action="submit">
        <input type="file" />
        <button>Submit</button>
      </form>
    </main>

    <script src="/dist/scripts/forms.js"></script>
  </body>
</html>
