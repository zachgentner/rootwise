<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes – Rootwise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <main class="notes-page">

      <div class="notes-topbar">
        <button id="notes-back" title="Back">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="notes-topbar-center">
          <p id="notes-person-name">Loading…</p>
          <p id="notes-person-dates"></p>
        </div>
        <div class="notes-topbar-end">
          <span id="notes-status"></span>
          <button id="notes-save">Save</button>
        </div>
      </div>

      <textarea
        id="notes-input"
        placeholder="Write notes about this ancestor…"
        spellcheck="true"
        autofocus
      ></textarea>

    </main>

    <script src="/dist/scripts/notes.js"></script>
  </body>
</html>
