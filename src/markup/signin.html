<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In – Rootwise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,600&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <main class="signin-page">
      <div class="signin-header">
        <img src="/src/img/logo.png" alt="Rootwise" />
      </div>

      <div class="signin-body">
        <p class="signin-title">Welcome back</p>

        <form id="signin-form" class="signin-form" autocomplete="on">
          <input
            id="email"
            type="email"
            placeholder="Email"
            autocomplete="email"
            required
          />
          <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
          <p id="error-msg"></p>
          <button type="submit">Sign In</button>
        </form>
      </div>
    </main>

    <script src="/dist/scripts/signin.js"></script>
  </body>
</html>
