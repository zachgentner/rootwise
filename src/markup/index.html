<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rootwise</title>
    <link rel="icon" type="image/x-icon" href="/src/img/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,600&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <main>

      <!-- HEADER -->
      <div id="info">
        <div id="profile">
          <i class="fa-regular fa-user"></i>
        </div>
        <div class="info-center">
          <h1 id="name">Firstname M. Surname</h1>
          <p id="lifespan">1800 – 1900</p>
        </div>
        <div class="info-end">
          <p id="id">ID: —</p>
          <i id="edit" role="button" class="fa-regular fa-pen-to-square"></i>
        </div>
      </div>

      <!-- WEB SEARCH OVERLAY -->
      <div id="webSearchMenu" style="display:none;">
        <button type="button" id="webSearchCancel">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <span class="websearch-eyebrow">Searching for</span>
        <p id="websearch-name">Firstname Surname</p>
        <p id="websearch-dates">1800 – 1900</p>
        <div class="websearch-grid">
          <a id="ws-google" class="websearch-btn" href="#" target="_blank">
            <i class="fa-brands fa-google"></i>
            <span>Google</span>
          </a>
          <a id="ws-familysearch" class="websearch-btn" href="#" target="_blank">
            <img src="/src/img/familysearch.svg" alt="" />
            <span>FamilySearch</span>
          </a>
        </div>
      </div>

      <!-- EDIT OVERLAY -->
      <form id="editMenu" style="display:none;">
        <button type="button" id="editCancel" title="Cancel">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <span class="edit-label">Forenames</span>
        <div class="edit-row">
          <input type="text" id="firstInput"  placeholder="First"  style="flex:1" />
          <input type="text" id="middleInput" placeholder="Middle" style="flex:1" />
        </div>

        <span class="edit-label">Surnames</span>
        <div class="edit-row">
          <input type="text" id="maidenInput"   placeholder="Maiden"  style="flex:1" />
          <input type="text" id="surnameInput"  placeholder="Surname" style="flex:1" />
        </div>

        <span class="edit-label">Dates</span>
        <div class="edit-row">
          <div class="edit-field" style="flex:1">
            <span class="edit-field-abbr">Birth</span>
            <input type="text" id="birthInput" placeholder="yyyy" />
          </div>
          <div class="edit-field" style="flex:1">
            <span class="edit-field-abbr">Death</span>
            <input type="text" id="deathInput" placeholder="yyyy" />
          </div>
        </div>

        <span class="edit-label">Source IDs</span>
        <div class="edit-field">
          <span class="edit-field-abbr">ANCS</span>
          <input type="text" id="ancestryInput" />
        </div>
        <div class="edit-field">
          <span class="edit-field-abbr">FAMS</span>
          <input type="text" id="familysearchInput" />
        </div>
        <div class="edit-field">
          <span class="edit-field-abbr">FGRV</span>
          <input type="text" id="findagraveInput" />
        </div>
        <div class="edit-field">
          <span class="edit-field-abbr">MHTG</span>
          <input type="text" id="myheritageInput" />
        </div>

        <p id="edit-status"></p>
        <div class="edit-actions">
          <div id="delete-btn">Delete</div>
          <div id="save-btn">Save</div>
        </div>
      </form>

      <!-- QUICKLINKS -->
      <div id="quicklinks">
        <button id="ancestry" title="Ancestry">
          <a class="link" href="http://www.ancestry.com" target="_blank">
            <img src="/src/img/ancestry.svg" alt="Ancestry" />
          </a>
        </button>
        <button id="familysearch" title="FamilySearch">
          <a class="link" href="http://www.familysearch.org" target="_blank">
            <img src="/src/img/familysearch.png" alt="FamilySearch" />
          </a>
        </button>
        <button id="fstree" title="FamilySearch Tree">
          <a class="link" href="http://www.familysearch.org" target="_blank">
            <img src="/src/img/fan.png" alt="Fan chart" />
          </a>
        </button>
        <button id="findagrave" title="Find A Grave">
          <a class="link" href="http://www.findagrave.com" target="_blank">
            <img src="/src/img/findagrave.png" alt="Find A Grave" />
          </a>
        </button>
      </div>

      <!-- SEARCH -->
      <form id="search" action="submit">
        <button id="submit" type="button">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <input
          id="input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          autocorrect="off"
          placeholder="Search ancestors…"
          autofocus
        />
      </form>

      <!-- SEARCH RESULTS -->
      <ul id="results"></ul>

      <!-- FAMILY -->
      <div id="family">

        <div class="fam-section">
          <span class="fam-label">Parents & Siblings</span>
          <div class="fam-parents">
            <div id="slot-father" class="fam-slot"></div>
            <div id="slot-mother" class="fam-slot"></div>
          </div>
          <div id="row-siblings" class="fam-siblings-row"></div>
        </div>

        <div id="section-spouses" class="fam-section"></div>

      </div>

      <!-- LINK OVERLAY -->
      <div id="linkMenu" style="display:none;">
        <div class="link-topbar">
          <span id="link-title">Attach</span>
          <button id="linkCancel" title="Cancel">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="link-search-row">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="linkInput" placeholder="Search ancestors…" autocomplete="off" spellcheck="false" />
        </div>
        <ul id="linkResults"></ul>
        <div class="link-footer">
          <p id="link-status"></p>
          <button id="link-add-new">
            <i class="fa-solid fa-user-plus"></i>
            <span>Create new person</span>
          </button>
        </div>
      </div>

      <!-- URLS OVERLAY -->
      <div id="urlsMenu" style="display:none;">
        <div class="link-topbar">
          <span class="link-topbar-title">Links</span>
          <button id="urlsCancel" title="Close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <ul id="urls-list"></ul>
        <div class="urls-add-form">
          <input type="url" id="url-input" placeholder="https://…" autocomplete="off" spellcheck="false" />
          <input type="text" id="url-label-input" placeholder="Label (optional)" autocomplete="off" spellcheck="false" />
          <button id="url-add-btn">
            <i class="fa-solid fa-plus"></i>
            <span>Add link</span>
          </button>
        </div>
      </div>

      <!-- TOOLBAR -->
      <div id="toolbar">
        <button id="sources" title="Sources">
          <a class="link" href="#"><i class="fa-solid fa-box-archive"></i></a>
        </button>
        <button id="photos" title="Photos">
          <a class="link" href="#"><i class="fa-regular fa-image"></i></a>
        </button>
        <button id="tasks" title="Tasks">
          <a class="link" href="#"><i class="fa-solid fa-list-check"></i></a>
        </button>
        <button id="notes" title="Notes">
          <a class="link" href="#"><i class="fa-regular fa-clipboard"></i></a>
        </button>
        <button id="links" title="Links">
          <a class="link" href="#"><i class="fa-solid fa-link"></i></a>
        </button>
        <button id="reports" title="Reports">
          <a class="link" href="#"><i class="fa-solid fa-chart-pie"></i></a>
        </button>
        <button id="websearch" title="Web Search">
          <a class="link" href="#"><i class="fa-solid fa-globe"></i></a>
        </button>
        <button id="settings" title="Settings">
          <a class="link" href="./settings.html"><i class="fa-solid fa-gear"></i></a>
        </button>
        <button id="popout" title="Pop Out">
          <a class="link" href="#"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
        </button>
        <button id="logout" title="Sign Out">
          <a class="link" href="#"><i class="fa-solid fa-arrow-right-from-bracket"></i></a>
        </button>
      </div>

    </main>

    <script src="/dist/scripts/script.js"></script>
  </body>
</html>
